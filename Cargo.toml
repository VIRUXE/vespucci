[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
debug = 1

[patch.crates-io]
# Vendored copy with two added `Archetype` fields (flags, time_flags); see docs/THIRD_PARTY.md.
rage-formats = { path = "third_party/rage-formats" }
